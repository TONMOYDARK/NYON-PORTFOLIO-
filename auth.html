<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account • Nyon Portfolio</title><link rel="stylesheet" href="styles.css"><style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.auth-card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px}.auth-card h1{margin:8px 0}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.tabs button.active{background:var(--text);color:#071016}.auth-form{display:grid;gap:13px}.auth-form label{font-size:12px;color:var(--muted);display:grid;gap:7px}.auth-form input{width:100%;background:#080d14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}.auth-form button{border:0;background:var(--text);color:#071016;padding:13px;border-radius:11px;font-weight:800;cursor:pointer}.msg{min-height:22px;color:#ff9fac}.msg.ok{color:var(--accent)}.hidden{display:none}.muted{color:var(--muted);font-size:13px}.back{display:inline-block;margin-bottom:10px;color:var(--muted)}
</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="back" href="index.html">← Back to portfolio</a><p class="eyebrow">ACCOUNT ACCESS</p><h1>Welcome</h1><p class="muted">Create an account or sign in to manage your profile.</p><div class="tabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Sign up</button></div>
<form id="loginForm" class="auth-form"><label>Email or username<input id="loginIdentity" required autocomplete="username"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label><button>Login</button></form>
<form id="signupForm" class="auth-form hidden"><label>Username<input id="signupUsername" required minlength="3" maxlength="30" autocomplete="username"></label><label>Email<input id="signupEmail" type="email" required autocomplete="email"></label><label>Password<input id="signupPassword" type="password" required minlength="6" autocomplete="new-password"></label><button>Create account</button></form>
<form id="forgotForm" class="auth-form hidden" style="margin-top:14px"><label>Email for password reset<input id="forgotEmail" type="email" required></label><button>Send reset email</button></form><p class="msg" id="msg"></p><button id="forgotToggle" style="background:transparent;color:var(--muted);padding:0;border:0;cursor:pointer">Forgot password?</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script><script>const lt=document.getElementById('loginTab'),st=document.getElementById('signupTab'),lf=document.getElementById('loginForm'),sf=document.getElementById('signupForm'),ff=document.getElementById('forgotForm'),ft=document.getElementById('forgotToggle');lt.onclick=()=>{lt.classList.add('active');st.classList.remove('active');lf.classList.remove('hidden');sf.classList.add('hidden');ff.classList.add('hidden')};st.onclick=()=>{st.classList.add('active');lt.classList.remove('active');sf.classList.remove('hidden');lf.classList.add('hidden');ff.classList.add('hidden')};ft.onclick=()=>{ff.classList.toggle('hidden');}</script></body></html>
