<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:850px;margin:auto;padding:38px 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin:16px 0}.form{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:12px;color:var(--muted);display:grid;gap:7px}input,textarea{width:100%;background:#080d14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}textarea{min-height:100px;resize:vertical}.preview{width:130px;height:160px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.save{display:inline-block;border:0;background:var(--text);color:#071016;padding:13px 18px;border-radius:11px;font-weight:800;cursor:pointer;text-decoration:none}.danger{border:1px solid #512c36;background:transparent;color:#ff9fac;padding:11px;border-radius:11px;cursor:pointer}.notice{color:var(--accent);min-height:20px}@media(max-width:700px){.row{grid-template-columns:1fr}}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}</style></head><body><header class="nav"><a class="brand" href="index.html">← Portfolio</a><button class="danger" id="logout">Logout</button></header><main class="admin"><div class="top"><div><p class="eyebrow">SECURE ADMIN</p><h1>Profile Dashboard</h1></div></div><div class="panel"><form class="form" id="form"><div><img id="preview" class="preview" src="assets/profile-placeholder.svg" alt="Profile preview"></div><label>Profile photo<input id="photoFile" type="file" accept="image/*"></label><div class="row"><label>Admin username<input id="username" required minlength="3"></label><label>Login email<input id="email" type="email" required></label></div><div class="row"><label>Name<input id="name"></label><label>Professional title<input id="title"></label></div><label>Short bio<textarea id="bio"></textarea></label><label>About me<textarea id="about"></textarea></label><div class="row"><label>Location<input id="location"></label><label>Focus<input id="focus"></label></div><div class="row"><label>Mobile<input id="phone"></label><label>WhatsApp number<input id="whatsapp"></label></div><div class="row"><label>Facebook URL<input id="facebook"></label><label>Instagram URL<input id="instagram"></label></div><label>LinkedIn URL<input id="linkedin"></label><label>Skills (one per line)<textarea id="skills"></textarea></label><label>CV file<input id="cvFile" type="file" accept=".pdf,.doc,.docx"></label><button class="save" type="submit">Save Profile</button><div class="notice" id="notice"></div></form></div><div class="panel"><h2>Change password</h2><form class="form" id="passwordForm"><label>New password<input id="newPassword" type="password" minlength="6" required autocomplete="new-password"></label><button class="save">Change password</button></form></div><p style="color:var(--muted);font-size:12px">Public visitors can create normal accounts, but only an account marked <b>admin</b> can open this dashboard.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
