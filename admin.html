<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login • Portfolio</title><link rel="stylesheet" href="styles.css"><style>
.admin{max-width:800px;margin:auto;padding:50px 22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px}.form{display:grid;gap:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-size:12px;color:var(--muted);display:grid;gap:7px}input,textarea{width:100%;box-sizing:border-box;background:#080d14;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}.preview{width:130px;height:160px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.save{border:0;background:var(--text);color:#071016;padding:13px 18px;border-radius:11px;font-weight:800;cursor:pointer}.danger{border:1px solid #512c36;background:transparent;color:#ff9fac;padding:11px;border-radius:11px;cursor:pointer}.notice{color:var(--accent);min-height:20px}.login{max-width:430px;margin:12vh auto}.login h1{margin-bottom:8px}.error{color:#ff9fac;min-height:20px;font-size:13px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.logout{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 13px;border-radius:10px;cursor:pointer}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head><body>
<header class="nav"><a class="brand" href="index.html">← Back to Portfolio</a></header>
<main class="admin">
<section id="loginBox" class="panel login"><p class="eyebrow">PRIVATE ADMIN</p><h1>Admin Login</h1><p style="color:var(--muted)">Sign in to edit your portfolio.</p><form id="loginForm" class="form"><label>Username<input id="loginUser" autocomplete="username" required></label><label>Password<input id="loginPass" type="password" autocomplete="current-password" required></label><button class="save" type="submit">Login</button><div class="error" id="loginError"></div></form></section>
<section id="editor" hidden><div class="topbar"><div><p class="eyebrow">PRIVATE PROFILE EDITOR</p><h1>Edit everything in one place</h1></div><button class="logout" id="logout">Logout</button></div><div class="panel"><form class="form" id="form"><div><img id="preview" class="preview" src="assets/profile-placeholder.svg" alt="Preview"></div><label>Profile photo<input id="photoFile" type="file" accept="image/*"></label><div class="row"><label>Name<input id="name"></label><label>Professional title<input id="title"></label></div><label>Short bio<textarea id="bio"></textarea></label><label>About me<textarea id="about"></textarea></label><div class="row"><label>Location<input id="location"></label><label>Focus<input id="focus"></label></div><div class="row"><label>Mobile number<input id="phone" inputmode="tel"></label><label>Email<input id="email" type="email"></label></div><div class="row"><label>Facebook URL<input id="facebook"></label><label>Instagram URL<input id="instagram"></label></div><div class="row"><label>WhatsApp number<input id="whatsapp" inputmode="tel" placeholder="8801XXXXXXXXX"></label><label>LinkedIn URL<input id="linkedin"></label></div><label>Skills (one per line)<textarea id="skills"></textarea></label><label>CV file (optional)<input id="cvFile" type="file" accept=".pdf,.doc,.docx"></label><button class="save" type="submit">Save Profile</button><button class="danger" type="button" id="reset">Reset to demo data</button><div class="notice" id="notice"></div></form></div><p style="color:var(--muted);font-size:12px;margin-top:18px">Quick login is included for this static Vercel version. For production-grade security, connect Supabase Auth.</p></section>
</main><script src="admin.js"></script></body></html>
